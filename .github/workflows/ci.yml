name: TDev CI - Step 3 Semgrep SAST

on:
  push:
    branches: [ "v3-semgrep", "v3-+semgrep" ]
  pull_request:
    branches: [ "v3-semgrep", "v3-+semgrep" ]

jobs:
  linting-stage:
    name: 🎨 1. Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: |
          uv add ruff
          uv run ruff check .

  security-sca:
    name: 🛡️ 2. Dependency Scan (Safety)
    runs-on: ubuntu-latest
    needs: linting-stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Safety Check (SCA)
        run: |
          uv add safety
          uv run safety check

  security-sast:
    name: 🔍 3. Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: security-sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto