name: TDev CI - Step 2 Safety SCA

on:
  push:
    branches: [ "v2-safety", "v2-+safety" ]
  pull_request:
    branches: [ "v2-safety", "v2-+safety" ]

jobs:
  linting-stage:
    name: 🎨 1. Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: |
          uv add ruff
          uv run ruff check .

  security-sca:
    name: 🛡️ 2. Dependency Vulnerability Scan (Safety)
    runs-on: ubuntu-latest
    needs: linting-stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Safety Check (SCA)
        run: |
          uv add safety
          uv run safety check