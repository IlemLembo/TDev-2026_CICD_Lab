name: TDev CI - Step 1 Linting Only

on:
  push:
    branches: [ "v1-linting-only" ]
  pull_request:
    branches: [ "v1-linting-only" ]

jobs:
  linting-stage:
    name: 🎨 Code Quality & Linting (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout repository source code
        uses: actions/checkout@v4

      - name: ⚡ 2. Set up ultra-fast uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: 🐍 3. Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 4. Install project dependencies via uv
        run: |
          uv sync --frozen

      - name: 🔍 5. Run Ruff Linter & Formatter Check
        run: |
          uv add ruff
          uv run ruff check .
          uv run ruff format --check .