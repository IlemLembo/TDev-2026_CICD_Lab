name: TDev CI/CD - Ultimate Production Pipeline

on:
  push:
    branches: [ "main", "master", "v7-production", "v7-*", "v7-production-ultimate" ]
  pull_request:
    branches: [ "main", "master", "v7-production", "v7-*", "v7-production-ultimate" ]

jobs:
  linting-stage:
    name: 🎨 1. Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@8f5b4af9862de04d03ac121e4b09b5ab0101918a # v5.3.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c212d93bf27216c9f24b135a513f4 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: |
          uv add ruff
          uv run ruff check .

  security-sca:
    name: 🛡️ 2. Dependency Scan (Safety)
    runs-on: ubuntu-latest
    needs: linting-stage
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@8f5b4af9862de04d03ac121e4b09b5ab0101918a # v5.3.0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c212d93bf27216c9f24b135a513f4 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Safety Check (SCA)
        run: |
          uv add safety
          uv run safety check

  security-sast:
    name: 🔍 3. Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: security-sca
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@73f6fbc59bb9321ff896599cc658b4daee33e89a # v1.111.0
        with:
          config: auto

  gitleaks-secrets:
    name: 🔑 4. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: security-sast
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@65226f7300e33ef44efaf5d993bb271c6628fb65 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: 🐳 5. Container & Dockerfile Scan (Trivy)
    runs-on: ubuntu-latest
    needs: gitleaks-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image
        run: docker build -t tdev-blog-app:latest .

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@915b19fea73b25a671b5bbabf663f71b0b007ba0 # 0.28.0
        with:
          image-ref: 'tdev-blog-app:latest'
          format: 'table'
          exit-code: '1' # En mode prod, on bloque si des failles CRITICAL/HIGH sont détectées !
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  dast-dynamic-scan:
    name: 🌐 6. Dynamic Application Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker Image
        run: docker build -t tdev-blog-app:latest .

      - name: Start Application Container
        run: |
          docker run -d -p 8000:8000 --name blog-app tdev-blog-app:latest
          timeout 30s bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 1; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@a6f370d061c5f35d55e0a6d0c73295c55047b640 # v0.12.0
        with:
          target: 'http://localhost:8000/'
          fail_action: false