name: TDev CI - Step 6 Dynamic App Scanning (OWASP ZAP)

on:
  push:
    branches: [ "v6-dast-zap", "v6-+zap" ]
  pull_request:
    branches: [ "v6-dast-zap", "v6-+zap" ]

jobs:
  linting-stage:
    name: 🎨 1. Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: |
          uv add ruff
          uv run ruff check .

  security-sca:
    name: 🛡️ 2. Dependency Scan (Safety)
    runs-on: ubuntu-latest
    needs: linting-stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Safety Check (SCA)
        run: |
          uv add safety
          uv run safety check

  security-sast:
    name: 🔍 3. Static Code Analysis (Semgrep)
    runs-on: ubuntu-latest
    needs: security-sca
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: auto

  gitleaks-secrets:
    name: 🔑 4. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: security-sast
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: 🐳 5. Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: gitleaks-secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tdev-blog-app:latest .

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'tdev-blog-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  dast-dynamic-scan:
    name: 🌐 6. Dynamic Application Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t tdev-blog-app:latest .

      - name: Start Application Container
        run: |
          docker run -d -p 8000:8000 --name blog-app tdev-blog-app:latest
          # Attente active du démarrage du serveur Django
          timeout 30s bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 1; done' || true

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/'
          fail_action: false # Ne bloque pas le pipeline, génère juste un rapport d'audit